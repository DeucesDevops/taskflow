apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taskflow
resources:
  - namespace.yaml
  - storage-class.yaml
  - persistent-volume-claims.yaml
  - configmap.yaml
  - services/postgres.yaml
  - services/postgres-headless.yaml
  - services/redis.yaml
  - services/redis-headless.yaml
  - services/rabbitmq.yaml
  - services/rabbitmq-headless.yaml
  - services/auth-service.yaml
  - services/project-service.yaml
  - services/task-service.yaml
  - services/notification-service.yaml
  - services/frontend.yaml
  - statefulsets/postgres.yaml
  - statefulsets/redis.yaml
  - statefulsets/rabbitmq.yaml
  - deployments/auth-service.yaml
  - deployments/project-service.yaml
  - deployments/task-service.yaml
  - deployments/notification-service.yaml
  - deployments/frontend.yaml
  - frontend-ingress.yaml
# Replace these five unpublished image references with images built and pushed by CI.
images:
  - name: taskflow/frontend
    newName: registry.example.com/taskflow/frontend
    newTag: replace-me
  - name: taskflow/auth-service
    newName: registry.example.com/taskflow/auth-service
    newTag: replace-me
  - name: taskflow/project-service
    newName: registry.example.com/taskflow/project-service
    newTag: replace-me
  - name: taskflow/task-service
    newName: registry.example.com/taskflow/task-service
    newTag: replace-me
  - name: taskflow/notification-service
    newName: registry.example.com/taskflow/notification-service
    newTag: replace-me
