apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: taskflow-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
# Keep EBS volumes if claims are deleted; clean them up explicitly after backup.
reclaimPolicy: Retain
