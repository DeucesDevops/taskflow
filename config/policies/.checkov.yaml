compact: true
framework:
  - terraform
  - github_actions
download-external-modules: false
external-checks-dir:
  - config/policies/checks
skip-path:
  - .*/\.terraform/.*
quiet: true
# These skips match the platform design. GitHub-hosted runners need a public
# registry and a reachable state account. Dev is intentionally smaller.
# The public site accepts TCP 80 and 443 only.
skip-check:
  - CKV_AZURE_59
  - CKV_AZURE_33
  - CKV_AZURE_43
  - CKV_AZURE_115
  - CKV_AZURE_117
  - CKV_AZURE_136
  - CKV_AZURE_139
  - CKV_AZURE_160
  - CKV_AZURE_163
  - CKV_AZURE_164
  - CKV_AZURE_165
  - CKV_AZURE_166
  - CKV_AZURE_167
  - CKV_AZURE_168
  - CKV_AZURE_170
  - CKV_AZURE_206
  - CKV_AZURE_226
  - CKV_AZURE_227
  - CKV_AZURE_230
  - CKV_AZURE_233
  - CKV_AZURE_237
  - CKV2_AZURE_1
  - CKV2_AZURE_21
  - CKV2_AZURE_33
  - CKV2_AZURE_57
