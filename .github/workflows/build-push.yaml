name: Build and push images

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend
          - auth-service
          - project-service
          - task-service
          - notification-service
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        env:
          SERVICE: ${{ matrix.service }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          registry="${ACR_LOGIN_SERVER:-example.azurecr.io}"
          image="${registry}/taskflow/${SERVICE}:${GITHUB_SHA}"
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"
          docker build --file "${SERVICE}/Dockerfile" --tag "${image}" "${SERVICE}"

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln,secret
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: SBOM
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532 # v0.20.0
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: "${{ matrix.service }}.spdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.service }}
          path: ${{ matrix.service }}.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push to ACR
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          set -euo pipefail
          test -n "${ACR_NAME}"
          az acr login --name "${ACR_NAME}"
          docker push "${IMAGE}"
