# ClusterSecretStore for Azure Key Vault via workload identity.
# scripts/apply-environment.sh renders ${KEY_VAULT_URI} from the identity output.
# The example vault host is kv-taskflow-prod.vault.azure.net only as a shape.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-key-vault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: ${KEY_VAULT_URI}
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
