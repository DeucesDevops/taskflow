controller:
  replicaCount: 2
  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
  ingressClassResource:
    name: nginx
    enabled: true
    default: true
  config:
    use-forwarded-headers: "true"
    ssl-redirect: "true"
    proxy-body-size: "2m"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  admissionWebhooks:
    patch:
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
