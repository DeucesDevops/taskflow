<rect x="90" y="310" width="470" height="145" rx="15" fill="#edf4ff" stroke="#2865bc" stroke-width="2"/>
<rect x="105" y="328" width="5" height="109" rx="2" fill="#2865bc" stroke="#2865bc" stroke-width="1"/>
<text x="124" y="326" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#172e48">Terraform foundation</text>
<text x="124" y="360" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">VPC, subnet routes, NAT, ECR, state storage,</text>
<text x="124" y="386" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">IAM integrations; proposed</text>
<rect x="90" y="515" width="470" height="190" rx="15" fill="#edf4ff" stroke="#2865bc" stroke-width="2"/>
<rect x="105" y="533" width="5" height="154" rx="2" fill="#2865bc" stroke="#2865bc" stroke-width="1"/>
<text x="124" y="531" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#172e48">kOps cluster lifecycle</text>
<text x="124" y="565" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">EC2 control plane and workers; etcd; cluster</text>
<text x="124" y="591" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">IAM and API endpoint. Review changes and</text>
<text x="124" y="617" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">validate after rolling updates.</text>
<rect x="90" y="765" width="470" height="230" rx="15" fill="#edf4ff" stroke="#2865bc" stroke-width="2"/>
<rect x="105" y="783" width="5" height="194" rx="2" fill="#2865bc" stroke="#2865bc" stroke-width="1"/>
<text x="124" y="781" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#172e48">Workloads and addons</text>
<text x="124" y="815" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">Plain application YAML today. Optional</text>
<text x="124" y="841" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">application Helm chart later. Give every addon</text>
<text x="124" y="867" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">one owner: kOps or Helm.</text>
<rect x="665" y="310" width="470" height="145" rx="15" fill="#f3effa" stroke="#7053a2" stroke-width="2"/>
<rect x="680" y="328" width="5" height="109" rx="2" fill="#7053a2" stroke="#7053a2" stroke-width="1"/>
<text x="699" y="326" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#172e48">Managed runtime secrets</text>
<text x="699" y="360" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">Proposed Secrets Manager -&gt; External Secrets</text>
<text x="699" y="386" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">Operator -&gt; Kubernetes Secret</text>
<rect x="665" y="515" width="470" height="190" rx="15" fill="#f3effa" stroke="#7053a2" stroke-width="2"/>
<rect x="680" y="533" width="5" height="154" rx="2" fill="#7053a2" stroke="#7053a2" stroke-width="1"/>
<text x="699" y="531" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#172e48">Application configuration</text>
<text x="699" y="565" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">ConfigMap + Secret -&gt; environment. Restart</text>
<text x="699" y="591" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">workloads after changes; rotate actual database</text>
<text x="699" y="617" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">and broker credentials too.</text>
<rect x="665" y="765" width="470" height="230" rx="15" fill="#f3effa" stroke="#7053a2" stroke-width="2"/>
<rect x="680" y="783" width="5" height="194" rx="2" fill="#7053a2" stroke="#7053a2" stroke-width="1"/>
<text x="699" y="781" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#172e48">Metrics, logs and alerts</text>
<text x="699" y="815" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">Proposed: application errors, readiness, outbox</text>
<text x="699" y="841" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">age, queue depth, Redis memory, nodes, etcd</text>
<text x="699" y="867" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">and backup failures.</text>
<rect x="1240" y="310" width="470" height="145" rx="15" fill="#eaf7f2" stroke="#168372" stroke-width="2"/>
<rect x="1255" y="328" width="5" height="109" rx="2" fill="#168372" stroke="#168372" stroke-width="1"/>
<text x="1274" y="326" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#172e48">Different recovery assets</text>
<text x="1274" y="360" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">Terraform state; kOps state; etcd backup; SQL</text>
<text x="1274" y="386" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">backup; Redis and RabbitMQ recovery data</text>
<rect x="1240" y="515" width="470" height="190" rx="15" fill="#eaf7f2" stroke="#168372" stroke-width="2"/>
<rect x="1255" y="533" width="5" height="154" rx="2" fill="#168372" stroke="#168372" stroke-width="1"/>
<text x="1274" y="531" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#172e48">Protected backup locations</text>
<text x="1274" y="565" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">Encrypted, access-restricted stores; retention</text>
<text x="1274" y="591" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">and recovery objectives; independent of worker</text>
<text x="1274" y="617" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">disks and PVC lifetimes</text>
<rect x="1240" y="765" width="470" height="230" rx="15" fill="#eaf7f2" stroke="#168372" stroke-width="2"/>
<rect x="1255" y="783" width="5" height="194" rx="2" fill="#168372" stroke="#168372" stroke-width="1"/>
<text x="1274" y="781" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#172e48">Prove restoration</text>
<text x="1274" y="815" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">Restore in isolation; validate task records and</text>
<text x="1274" y="841" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">notification behavior; record RPO/RTO. Retain</text>
<text x="1274" y="867" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#50647a">storage is not a backup.</text>
<polyline points="60,1145 1740,1145" fill="none" stroke="#d5deea" stroke-width="3" stroke-linejoin="round"/>
<text x="60" y="1165" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#172e48">Current: ignored local .env; Kubernetes Secret template; persistent volumes; health probes; CI hardening checks.</text>
<text x="60" y="1198" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#50647a">Target: managed secrets, workload IAM, observability and tested restores. Cluster backups do not contain PostgreSQL volume data.</text>
</svg>
