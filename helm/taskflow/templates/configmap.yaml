apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
data:
  SESSION_COOKIE_SECURE: {{ .Values.config.sessionCookieSecure | quote }}
  DEMO_EMAIL: {{ .Values.config.demoEmail | quote }}
  RABBITMQ_QUEUE: {{ .Values.rabbitmq.queue | quote }}
  POSTGRES_HOST: {{ .Values.postgres.host | quote }}
  POSTGRES_PORT: {{ .Values.postgres.port | quote }}
  POSTGRES_DATABASE: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_SSLMODE: {{ .Values.postgres.sslmode | quote }}
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  PROJECT_JDBC_URL: {{ printf "jdbc:postgresql://%s:%v/%s?sslmode=%s" .Values.postgres.host .Values.postgres.port .Values.postgres.database .Values.postgres.sslmode | quote }}
