{{- if .Values.externalSecrets.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if ne $name "frontend" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "taskflow.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.secretStoreRef.name }}
    kind: {{ $.Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        {{- if eq $name "auth-service" }}
        DATABASE_URL: {{ printf "postgres://%s:{{ `{{ .db_password }}` }}@%s:%v/%s?sslmode=%s" $.Values.postgres.user $.Values.postgres.host $.Values.postgres.port $.Values.postgres.database $.Values.postgres.sslmode | quote }}
        REDIS_URL: "{{ `{{ .redis_url }}` }}"
        JWT_SECRET: "{{ `{{ .jwt_secret }}` }}"
        DEMO_PASSWORD: "{{ `{{ .demo_password }}` }}"
        {{- else if eq $name "project-service" }}
        DB_PASSWORD: "{{ `{{ .db_password }}` }}"
        {{- else if eq $name "task-service" }}
        DATABASE_URL: {{ printf "postgres://%s:{{ `{{ .db_password }}` }}@%s:%v/%s?sslmode=%s" $.Values.postgres.user $.Values.postgres.host $.Values.postgres.port $.Values.postgres.database $.Values.postgres.sslmode | quote }}
        {{- else if eq $name "notification-service" }}
        REDIS_URL: "{{ `{{ .redis_url }}` }}"
        {{- end }}
  data:
    {{- if or (eq $name "auth-service") (eq $name "project-service") (eq $name "task-service") }}
    - secretKey: db_password
      remoteRef:
        key: {{ $.Values.externalSecrets.keys.postgresPassword }}
    {{- end }}
    {{- if or (eq $name "auth-service") (eq $name "notification-service") }}
    - secretKey: redis_url
      remoteRef:
        key: {{ $.Values.externalSecrets.keys.redisUrl }}
    {{- end }}
    {{- if eq $name "auth-service" }}
    - secretKey: jwt_secret
      remoteRef:
        key: {{ $.Values.externalSecrets.keys.jwtSecret }}
    - secretKey: demo_password
      remoteRef:
        key: {{ $.Values.externalSecrets.keys.demoPassword }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
